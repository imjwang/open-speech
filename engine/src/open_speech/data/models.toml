# Open Speech model catalog (08 § Model catalog).
#
# Every model ID the engine uses comes from here; nothing is hard-coded elsewhere. User overrides in
# app data (`models.toml`) are deep-merged over this file: tables merge, scalars and lists replace.
#
# Layout: [tts.<provider>."<model>"], [stt.<provider>], [stt.local."<model>"], [llm.<provider>].
# Voice IDs are "provider:model:voice" (04 § Conventions).

# ------------------------------------------------------------------------------------------- TTS

[tts.openai."gpt-4o-mini-tts"]
name = "OpenAI"
snapshot = "gpt-4o-mini-tts-2025-12-15"   # sent to the API so cached audio stays reproducible
voices = ["alloy", "ash", "ballad", "cedar", "coral", "echo", "fable", "marin", "nova", "onyx", "sage", "shimmer", "verse"]  # (verify list)
formats = ["opus", "mp3", "aac", "flac", "wav", "pcm"]
style = "instructions"
stream = true
max_input_chars = 4000          # (verify)
timestamps = false
languages = []                  # multilingual: the voice follows the language of the text

[tts.gemini."gemini-3.8-flash-tts"]
name = "Gemini Flash TTS"
api = "interactions"            # client.interactions.create, api_version v1beta, google-genai >= 2.25
api_version = "v1beta"
voices = ["Zephyr", "Puck", "Charon", "Kore", "Fenrir", "Leda", "Orus", "Aoede", "Callirrhoe", "Autonoe", "Enceladus", "Iapetus", "Umbriel", "Algieba", "Despina", "Erinome", "Algenib", "Rasalgethi", "Laomedeia", "Achernar", "Alnilam", "Schedar", "Gacrux", "Pulcherrima", "Achird", "Zubenelgenubi", "Vindemiatrix", "Sadachbia", "Sadaltager", "Sulafat"]
voices_endpoint = true          # client.voices.list() for the larger library (P1)
format = "l16"                  # 24 kHz mono PCM16 when streaming; wav when unary
sample_rate = 24000
style = "speech_metadata"
stream = true
max_input_chars = 4000          # (verify)
timestamps = false
languages = []                  # multilingual: the voice follows the language of the text

[tts.gemini."gemini-3.8-flash-lite-tts"]
inherit = "gemini-3.8-flash-tts"
name = "Gemini Flash Lite TTS"
languages = 101                 # count only; the API auto-detects the language

# Google Cloud Text-to-Speech, Chirp 3 HD (providers/google_tts.py; plain HTTPS, no Google SDK). The default
# voice for reading and replies ("auto" = `default_star` in the language's first locale) while the month's free
# characters last (pricing.toml). Key: GOOGLE_TTS_API_KEY, else GEMINI_API_KEY (Cloud Text-to-Speech must be an
# enabled, allowed API for it). Voice ids: "google:chirp3-hd:<locale>-Chirp3-HD-<star>", e.g.
# google:chirp3-hd:en-US-Chirp3-HD-Zephyr. At startup the engine lists the live voices (free) and offers only
# catalog voices the API also lists.
[tts.google."chirp3-hd"]
name = "Chirp 3 HD"
api = "texttospeech-v1"          # POST /v1/text:synthesize, header X-Goog-Api-Key; GET /v1/voices for the check
voice_template = "{locale}-Chirp3-HD-{star}"
locales = ["en-US", "en-GB", "es-US", "es-ES"]   # the first locale of a language is the one "auto" uses
stars = [
  "Achernar", "Achird", "Algenib", "Algieba", "Alnilam", "Aoede", "Autonoe", "Callirrhoe", "Charon",
  "Despina", "Enceladus", "Erinome", "Fenrir", "Gacrux", "Iapetus", "Kore", "Laomedeia", "Leda", "Orus",
  "Puck", "Pulcherrima", "Rasalgethi", "Sadachbia", "Sadaltager", "Schedar", "Sulafat", "Umbriel",
  "Vindemiatrix", "Zephyr", "Zubenelgenubi",
]
default_star = "Zephyr"          # same name as the owner's earlier Gemini voice; also its Spanish voice (es-US)
format = "l16"                   # LINEAR16 WAV, decoded to PCM; no speakingRate (speed stays in the transport)
sample_rate = 24000
max_input_chars = 5000           # the API's limit is 5,000 bytes of UTF-8 per request; longer text is split
stream = false
timestamps = false               # word timing is estimated (playback/timing.py, pause-anchored)
voices_endpoint = true

[tts.kokoro."kokoro-82m-v1.0"]
name = "Kokoro"
local = true
license = "Apache-2.0"
ram_gb = 1.3
speed = "~10x real time on CPU"
languages = ["en-US", "en-GB", "es"]  # one built-in phonemizer per language (providers/g2p*.py)
timestamps = true
max_input_chars = 4000
sample_rate = 24000
max_tokens = 510                # model context minus the two pad tokens
# The first letter of a voice name is its language: a = American English, b = British English, e = Spanish.
