# ------------------------------------------------------------------------------------------- STT

[stt.openai]
streaming = ["gpt-realtime-whisper", "gpt-live-transcribe"]   # (verify streaming semantics)
batch = ["gpt-4o-transcribe", "gpt-4o-mini-transcribe", "gpt-transcribe"]
word_timestamps = ["whisper-1"]

[stt.gemini]
streaming = ["gemini-3.8-live"]       # (verify) Live API input transcription
batch = ["gemini-3.5-transcribe"]     # word timestamps
api_version = "v1beta"

[stt.fixture]
test_only = true
batch = ["fixture-stt"]

# On-device speech-to-text, run by sherpa-onnx (providers/local_stt.py). No key, offline, free; the default
# for the command bar when its weights are present. Weights are pinned by commit + sha256 per file and live
# in `models/stt/<model>/` (app data, or read-only inside the packaged app).
[stt.local]
default = "parakeet-tdt-0.6b-v3-int8"

# NVIDIA Parakeet TDT 0.6B v3 (int8 ONNX export for sherpa-onnx). Chosen by measurement on an Apple M4
# (2026-11-21) over Canary 180M Flash and Whisper base: the best exact-match rate for spoken commands and
# dictated sentences in English and Spanish, and it needs no language hint.
[stt.local."parakeet-tdt-0.6b-v3-int8"]
name = "Parakeet speech recognition"
family = "nemo_transducer"
license = "CC-BY-4.0"            # the recognizer; the Silero VAD that ships with it is MIT
ram_gb = 2.0                     # measured: the engine grows by ~1.9 GB while it is loaded (2.5 GB decoding 30 s)
speed = "~25x real time on CPU"  # 2 threads: a 3 s command in ~0.14 s, 6 s in ~0.2 s
num_threads = 2                  # 1 thread doubles those times, 4 threads take off a third
languages = [                    # detected automatically; the model takes no language hint
  "bg", "hr", "cs", "da", "nl", "en", "et", "fi", "fr", "de", "el", "hu", "it", "lv", "lt", "mt", "pl",
  "pt", "ro", "sk", "sl", "es", "sv", "ru", "uk",
]
encoder = "encoder.int8.onnx"
decoder = "decoder.int8.onnx"
joiner = "joiner.int8.onnx"
tokens = "tokens.txt"
vad = "silero_vad.onnx"          # keeps non-speech (hiss, clicks, coughs) from being transcribed as words

[stt.local."parakeet-tdt-0.6b-v3-int8".weights]
url = "hf://csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
revision = "ed5d745623472f97cfc2e6c2916ee248798fc5a8"  # pinned; same commit the app bundles
quant = "int8"
size_mb = 642
model_file = "encoder.int8.onnx"
tokenizer_file = "tokens.txt"
# sha256 of every file at the pinned commits (Hugging Face LFS hashes; tokens.txt hashed after download,
# 2026-11-21). Silero VAD v5 comes from the sherpa-onnx author's VAD repository, pinned the same way.
files = [
  { path = "encoder.int8.onnx", sha256 = "1afbe69c1ffdabee94755f42e4daf1d93549131a3da11356bda84fcef0f2c479", size_mb = 622.1 },
  { path = "decoder.int8.onnx", sha256 = "0222a86147299d4dee90edf95b6d13827edb42ad8b7c9cf0b2582f030937c0b5", size_mb = 11.3 },
  { path = "joiner.int8.onnx", sha256 = "cbd02f3696e9944970111fb439d9c3fd365a80374565f13f2b9c7007d253fc98", size_mb = 6.1 },
  { path = "tokens.txt", sha256 = "d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d", size_mb = 0.1 },
  { path = "silero_vad.onnx", sha256 = "6b99cbfd39246b6706f98ec13c7c50c6b299181f2474fa05cbc8046acc274396", size_mb = 2.2, url = "https://huggingface.co/csukuangfj/vad/resolve/fba88cd2e921609e7675c3aaf51e0b9b295da4bc/silero_vad_v5.onnx" },
]

# ------------------------------------------------------------------------------------------- LLM

[llm.anthropic]
default = "claude-haiku-5-5"
options = ["claude-haiku-5-5", "claude-sonnet-5-5", "claude-opus-5-5", "claude-fable-5-2"]
annotate_max_tokens = 4096
transform_max_tokens = 16000
compile_max_tokens = 2048
vision_max_tokens = 4096
thinking_reserve_tokens = 4096   # added to a call's max_tokens whenever the model may think (thinking counts)

# Per-model request traits (05 § Tier 2, 07 § Agent core). A model without an entry gets the safe defaults:
# the thinking parameter left out (each model's own default, adaptive on every current model) and no
# server-side refusal fallback.
#   thinking_off       how this model turns thinking off for the tool-less calls (annotate, compile, vision):
#                      "disabled" | "between_tools" | "omit" (can't be turned off: leave the parameter out)
#   server_fallback    send `fallbacks = "default"` with the server-side-fallback beta on agent turns
#   annotate_thinking  "off" (the thinking_off form) or "adaptive", chosen by the AI Enhanced accuracy gate
#                      (tests/live/test_annotate_eval.py)
[llm.anthropic.models."claude-haiku-5-5"]
thinking_off = "disabled"        # accepted at effort low/medium/high; `between_tools` is a 400 here
server_fallback = false          # Haiku 5.5 has no server-side refusal fallback
# Accuracy gate, 2026-11-22 (3 runs, 47 must-keep / 9 must-drop labels): with thinking disabled Haiku dropped
# kept text 5 times; adaptive at low effort matched Sonnet (0 violations, 100 % recall) at a tenth of the cost.
annotate_thinking = "adaptive"

[llm.anthropic.models."claude-sonnet-5-5"]
thinking_off = "between_tools"   # `disabled` is a 400 on Sonnet 5.5
server_fallback = true
annotate_thinking = "off"

[llm.anthropic.models."claude-opus-5-5"]
thinking_off = "omit"            # `disabled` is a 400 at every effort: low effort is the only lever
server_fallback = true
annotate_thinking = "adaptive"

[llm.anthropic.models."claude-fable-5-2"]
thinking_off = "omit"            # thinking is always on
server_fallback = true
annotate_thinking = "adaptive"

[llm.fixture]
test_only = true
default = "fixture-llm"
options = ["fixture-llm"]

