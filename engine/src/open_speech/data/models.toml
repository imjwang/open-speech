# Open Speech model catalog (08 § Model catalog).
#
# Every model ID the engine uses comes from here; nothing is hard-coded elsewhere. User overrides in
# app data (`models.toml`) are deep-merged over this file: tables merge, scalars and lists replace.
#
# Layout: [tts.<provider>."<model>"], [stt.<provider>], [stt.local."<model>"], [llm.<provider>].
# Voice IDs are "provider:model:voice" (04 § Conventions).

# ------------------------------------------------------------------------------------------- TTS

[tts.openai."gpt-4o-mini-tts"]
name = "OpenAI"
snapshot = "gpt-4o-mini-tts-2025-12-15"   # sent to the API so cached audio stays reproducible
voices = ["alloy", "ash", "ballad", "cedar", "coral", "echo", "fable", "marin", "nova", "onyx", "sage", "shimmer", "verse"]  # (verify list)
formats = ["opus", "mp3", "aac", "flac", "wav", "pcm"]
style = "instructions"
stream = true
max_input_chars = 4000          # (verify)
timestamps = false
languages = []                  # multilingual: the voice follows the language of the text

[tts.gemini."gemini-3.8-flash-tts"]
name = "Gemini Flash TTS"
api = "interactions"            # client.interactions.create, api_version v1beta, google-genai >= 2.25
api_version = "v1beta"
voices = ["Zephyr", "Puck", "Charon", "Kore", "Fenrir", "Leda", "Orus", "Aoede", "Callirrhoe", "Autonoe", "Enceladus", "Iapetus", "Umbriel", "Algieba", "Despina", "Erinome", "Algenib", "Rasalgethi", "Laomedeia", "Achernar", "Alnilam", "Schedar", "Gacrux", "Pulcherrima", "Achird", "Zubenelgenubi", "Vindemiatrix", "Sadachbia", "Sadaltager", "Sulafat"]
voices_endpoint = true          # client.voices.list() for the larger library (P1)
format = "l16"                  # 24 kHz mono PCM16 when streaming; wav when unary
sample_rate = 24000
style = "speech_metadata"
stream = true
max_input_chars = 4000          # (verify)
timestamps = false
languages = []                  # multilingual: the voice follows the language of the text

[tts.gemini."gemini-3.8-flash-lite-tts"]
inherit = "gemini-3.8-flash-tts"
name = "Gemini Flash Lite TTS"
languages = 101                 # count only; the API auto-detects the language

[tts.kokoro."kokoro-82m-v1.0"]
name = "Kokoro"
local = true
license = "Apache-2.0"
ram_gb = 1.3
speed = "~10x real time on CPU"
languages = ["en-US", "en-GB", "es"]  # one built-in phonemizer per language (providers/g2p*.py)
timestamps = true
max_input_chars = 4000
sample_rate = 24000
max_tokens = 510                # model context minus the two pad tokens
# The first letter of a voice name is its language: a = American English, b = British English, e = Spanish.
voices = [
  "af_heart", "af_alloy", "af_aoede", "af_bella", "af_jessica", "af_kore", "af_nicole", "af_nova",
  "af_river", "af_sarah", "af_sky", "am_adam", "am_echo", "am_eric", "am_fenrir", "am_liam",
  "am_michael", "am_onyx", "am_puck", "bf_alice", "bf_emma", "bf_isabella", "bf_lily",
  "bm_daniel", "bm_fable", "bm_george", "bm_lewis",
  "ef_dora", "em_alex", "em_santa",
]

[tts.kokoro."kokoro-82m-v1.0".weights]
url = "hf://onnx-community/Kokoro-82M-v1.0-ONNX-timestamped"
revision = "dd4401a9add81ac692d20e240d22ec9dda82cc29"  # pinned; same commit the app bundles
quant = "q8"
size_mb = 92
# sha256 pins for the model and tokenizer (recorded 2026-11-21 from revision "main"). Voice files are
# trust-on-first-use: their hashes are recorded in the model's manifest.json (03 § Supply chain).
sha256 = ""
model_file = "onnx/model_quantized.onnx"
tokenizer_file = "tokenizer.json"
voice_file = "voices/{voice}.bin"
files = [
  { path = "onnx/model_quantized.onnx", sha256 = "c0c02b3299fd97c34ea92a98e6d41eaa1a739c8f77bf685aac34bd7b34c1132c", size_mb = 92 },
  { path = "tokenizer.json", sha256 = "77a02c8e164413299b4b4c403b14f8e0e1c1b727db4d46a09d6327b861060a34", size_mb = 0.1 },
]
voice_size_mb = 0.5

[tts.qwen3."qwen3-tts-12hz-0.6b"]            # P2, preset voices only (no cloning)
name = "Qwen3-TTS"
local = true
status = "later"                 # listed by the model manager, never offered as a voice yet
runtimes = ["mlx-audio"]         # Apple Silicon
size_gb = 1.3                    # GGUF Q8; ~2.5 GB bf16
ram_gb = 3
speed = "~1.3–1.8x real time on M-series"
license = "Apache-2.0"
languages = ["zh", "en", "ja", "ko", "de", "fr", "ru", "pt", "es", "it"]
requires = "apple-silicon"
timestamps = false
voices = []

# Deterministic test voices (providers/fixture.py). Only surfaced when OPEN_SPEECH_FIXTURE_PROVIDERS=1;
# never in packaged builds. "tone-v1" stands in for the free local voice, "tone-paid-v1" simulates a
# paid cloud voice (priced in pricing.toml) so budget and estimate flows can be exercised end to end.
[tts.fixture."tone-v1"]
name = "Test tone voice"
test_only = true
local = true
timestamps = true
style = "instructions"
voices = ["alto", "bass"]
sample_rate = 24000
max_input_chars = 4000
languages = ["en"]
license = "Apache-2.0"

[tts.fixture."tone-paid-v1"]
name = "Test tone voice (paid simulation)"
test_only = true
local = false
timestamps = true
style = "instructions"
voices = ["soprano"]
sample_rate = 24000
max_input_chars = 4000
languages = ["en"]

# BYO OpenAI-compatible server (P1, FR-VOICE-7). Add entries in the user models.toml, e.g.:
# [tts.openai_compatible."kokoro-fastapi"]
# base_url = "http://127.0.0.1:8880/v1"
# api_model = "kokoro"
# voices = ["af_heart"]
# response_format = "wav"

# ------------------------------------------------------------------------------------------- STT

[stt.openai]
streaming = ["gpt-realtime-whisper", "gpt-live-transcribe"]   # (verify streaming semantics)
batch = ["gpt-4o-transcribe", "gpt-4o-mini-transcribe", "gpt-transcribe"]
word_timestamps = ["whisper-1"]

[stt.gemini]
streaming = ["gemini-3.8-live"]       # (verify) Live API input transcription
batch = ["gemini-3.5-transcribe"]     # word timestamps
api_version = "v1beta"

[stt.fixture]
test_only = true
batch = ["fixture-stt"]

# On-device speech-to-text, run by sherpa-onnx (providers/local_stt.py). No key, offline, free; the default
# for the command bar when its weights are present. Weights are pinned by commit + sha256 per file and live
# in `models/stt/<model>/` (app data, or read-only inside the packaged app).
[stt.local]
default = "parakeet-tdt-0.6b-v3-int8"

# NVIDIA Parakeet TDT 0.6B v3 (int8 ONNX export for sherpa-onnx). Chosen by measurement on an Apple M4
# (2026-11-21) over Canary 180M Flash and Whisper base: the best exact-match rate for spoken commands and
# dictated sentences in English and Spanish, and it needs no language hint.
[stt.local."parakeet-tdt-0.6b-v3-int8"]
name = "Parakeet speech recognition"
family = "nemo_transducer"
license = "CC-BY-4.0"            # the recognizer; the Silero VAD that ships with it is MIT
ram_gb = 2.0                     # measured: the engine grows by ~1.9 GB while it is loaded (2.5 GB decoding 30 s)
speed = "~25x real time on CPU"  # 2 threads: a 3 s command in ~0.14 s, 6 s in ~0.2 s
num_threads = 2                  # 1 thread doubles those times, 4 threads take off a third
languages = [                    # detected automatically; the model takes no language hint
  "bg", "hr", "cs", "da", "nl", "en", "et", "fi", "fr", "de", "el", "hu", "it", "lv", "lt", "mt", "pl",
  "pt", "ro", "sk", "sl", "es", "sv", "ru", "uk",
]
encoder = "encoder.int8.onnx"
decoder = "decoder.int8.onnx"
joiner = "joiner.int8.onnx"
tokens = "tokens.txt"
vad = "silero_vad.onnx"          # keeps non-speech (hiss, clicks, coughs) from being transcribed as words

[stt.local."parakeet-tdt-0.6b-v3-int8".weights]
url = "hf://csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8"
revision = "ed5d745623472f97cfc2e6c2916ee248798fc5a8"  # pinned; same commit the app bundles
quant = "int8"
size_mb = 642
model_file = "encoder.int8.onnx"
tokenizer_file = "tokens.txt"
# sha256 of every file at the pinned commits (Hugging Face LFS hashes; tokens.txt hashed after download,
# 2026-11-21). Silero VAD v5 comes from the sherpa-onnx author's VAD repository, pinned the same way.
files = [
  { path = "encoder.int8.onnx", sha256 = "1afbe69c1ffdabee94755f42e4daf1d93549131a3da11356bda84fcef0f2c479", size_mb = 622.1 },
  { path = "decoder.int8.onnx", sha256 = "0222a86147299d4dee90edf95b6d13827edb42ad8b7c9cf0b2582f030937c0b5", size_mb = 11.3 },
  { path = "joiner.int8.onnx", sha256 = "cbd02f3696e9944970111fb439d9c3fd365a80374565f13f2b9c7007d253fc98", size_mb = 6.1 },
  { path = "tokens.txt", sha256 = "d58544679ea4bc6ac563d1f545eb7d474bd6cfa467f0a6e2c1dc1c7d37e3c35d", size_mb = 0.1 },
  { path = "silero_vad.onnx", sha256 = "6b99cbfd39246b6706f98ec13c7c50c6b299181f2474fa05cbc8046acc274396", size_mb = 2.2, url = "https://huggingface.co/csukuangfj/vad/resolve/fba88cd2e921609e7675c3aaf51e0b9b295da4bc/silero_vad_v5.onnx" },
]

# ------------------------------------------------------------------------------------------- LLM

[llm.anthropic]
default = "claude-sonnet-5-5"
options = ["claude-sonnet-5-5", "claude-opus-5-5", "claude-haiku-5-5", "claude-fable-5-2"]
annotate_max_tokens = 4096
transform_max_tokens = 16000
compile_max_tokens = 2048
vision_max_tokens = 4096

[llm.fixture]
test_only = true
default = "fixture-llm"
options = ["fixture-llm"]
