# Qwen3-TTS (Apache-2.0), local on Apple Silicon through MLX (providers/qwen3.py; generation runs in its own process,
# providers/qwen3_worker.py). One voice list, whatever weights read it: the size and precision come from the settings
# `qwen3.size` / `qwen3.precision` ("auto" = the measured defaults below) and resolve to one of the
# `[local_weights.qwen3."…"]` variants generated at the end of this file. Voice ids: "qwen3:qwen3-tts:<Speaker>" for
# the preset speakers (CustomVoice weights), "qwen3:clone:<slug>" for cloned voices (Base weights). Weights are
# downloaded on demand, never bundled.
[tts.qwen3."qwen3-tts"]
name = "Qwen3-TTS"
local = true
license = "Apache-2.0"
requires = "apple-silicon"
runtimes = ["mlx-audio"]
timestamps = false               # word timing is estimated from the audio (playback/timing.py, pause-anchored)
sample_rate = 24000
max_input_chars = 2000
# The preset speakers (CustomVoice), in the order the voice list shows them; each speaks every language below, its
# own most naturally. `speakers.<name>` gives its native language and the model card's description.
voices = ["Ryan", "Aiden", "Serena", "Vivian", "Uncle_Fu", "Dylan", "Eric", "Ono_Anna", "Sohee"]
languages = ["en", "es", "zh", "ja", "ko", "de", "fr", "ru", "pt", "it"]
# Defaults by measurement on an Apple M4 MacBook Air, 16 GB (docs/08 § Local models): the size and precision that
# sound best while still generating at least 1.3x faster than real time over 10 minutes of continuous reading.
default_size = "0.6b"
default_precision = "8bit"
small_memory_gb = 8              # at or below this much memory, "auto" means the 0.6B size
small_memory_size = "0.6b"
stream_interval_s = 0.5          # audio per streamed chunk: first audio after ~0.3 s on 0.6B, ~0.4 s on 1.7B
# Sampling (the model's generation_config.json defaults). Changing any of these changes the audio: bump
# params_version so cached Qwen audio is made again.
params_version = 1
temperature = 0.9
top_k = 50
top_p = 1.0
repetition_penalty = 1.05

[tts.qwen3."qwen3-tts".speakers]
Ryan = { language = "en", description = "Dynamic male voice with a strong sense of rhythm" }
Aiden = { language = "en", description = "Sunny American male voice with a clear midrange" }
Serena = { language = "zh", description = "Warm, gentle young female voice" }
Vivian = { language = "zh", description = "Bright, slightly edgy young female voice" }
Uncle_Fu = { language = "zh", description = "Seasoned male voice with a low, mellow timbre" }
Dylan = { language = "zh", description = "Youthful Beijing male voice" }
Eric = { language = "zh", description = "Lively Chengdu male voice (Sichuan accent)" }
Ono_Anna = { language = "ja", description = "Playful Japanese female voice" }
Sohee = { language = "ko", description = "Warm Korean female voice" }

