# ---------------------------------------------------------------------------------------- Google

[google."chirp3-hd"]
# Cloud Text-to-Speech, Chirp 3 HD voices (verify): the first 1,000,000 characters each month are free, then
# $30 per million characters (spaces count). The allowance belongs to the Google billing account, so other use of
# the same account isn't visible here: "remaining" is an estimate and FreeTierGuard keeps a 2 % reserve.
per_mchars = "30.00"
free_chars_per_month = 1_000_000
free_period_tz = "America/Los_Angeles"   # (verify) the billing month is assumed to follow Pacific time

