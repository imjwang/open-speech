[project]
name = "open-speech"
version = "0.1.0"
description = "Open Speech engine: a headless speech engine with a local REST/WebSocket API."
readme = "README.md"
license = "Apache-2.0"
# 03 § Engine: the newest Python with wheels for every pin. 3.14 builds were not
# installable in the scaffold environment, so 3.13 is the floor and 3.14 is allowed.
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "platformdirs>=4.3",
  "httpx>=0.27",
  "tenacity>=9.0",
  "pyyaml>=6.0",
  "typer>=0.13",
  "numpy>=2.1",
  "soundfile>=0.12",
  "sounddevice>=0.5",
  "pypdfium2>=4.30",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "trafilatura>=2.0",
  "pysbd>=0.3.4",
  "pillow>=11.0",
  "zstandard>=0.23",
  "watchfiles>=0.24",
  "python-multipart>=0.0.12",
  "tomli-w>=1.1",
  "anthropic>=0.70",
  "openai>=1.60",
  "google-genai>=1.50",
  "soxr>=0.5",
]

[project.optional-dependencies]
# Default install for packaged builds (08 § Local models). English G2P without espeak (R13).
local-kokoro = [
    "misaki>=0.9.4",
    "onnxruntime>=1.20",
]
# On-device speech-to-text for the command bar (providers/local_stt.py): Parakeet TDT via sherpa-onnx
# (Apache-2.0; it bundles its own onnxruntime build).
local-stt = ["sherpa-onnx>=2.0"]
# Local Qwen3-TTS voices (providers/qwen3.py, run in providers/qwen3_worker.py): MLX on Apple Silicon only. Pinned
# exactly: mlx-audio's model code changes between releases, and cached audio is keyed to what it produces. The
# runtime is bundled in the app; the weights are downloaded on demand (local/manager.py), never bundled.
local-qwen = ["mlx-audio==0.6.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mcp = ["mcp>=1.2"]

[project.scripts]
open-speech = "open_speech.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "reportlab>=4.2",
  "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real provider APIs (needs OPEN_SPEECH_LIVE=1)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "SIM118", "ASYNC109", "ASYNC240"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
