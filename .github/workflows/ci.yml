name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    # 10 § Delivery: CI runs on macOS arm64 runners.
    runs-on: macos-15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - name: Lint
        run: uv run ruff check .
      - name: API contracts are current (openapi.json, ws-schema.json)
        run: uv run python -m open_speech.api.export --check
      - name: Tests (fixtures only; no live provider calls)
        run: uv run pytest -q
        env:
          OPEN_SPEECH_LIVE: "0"

  app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Node still runs vitest, electron-vite and the scripts (through their shebangs).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Generated engine client is current (FR-API-2)
        run: bun run check:api
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  e2e:
    needs: [engine, app]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd engine && uv sync --all-extras --frozen
      - run: cd app && bun install --frozen-lockfile
      - name: UI, accessibility and voice-only workflows (fixture providers)
        run: cd app && bun run e2e
